name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and dependency checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:dependencies

  macos-tests:
    name: macOS tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # `rust` runs the same command on Linux, where `openflow-native` is
      # `cfg(target_os = "macos")` down to an empty main -- so its tests have
      # never run anywhere but a contributor's own Mac. This is the job that
      # runs them. It is not a duplicate of `rust`: on this runner the same
      # command has 77 more tests to find.
      - run: cargo test --workspace

  rust:
    name: Rust quality checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential
          libasound2-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm run check:rust

  runner:
    name: Runner sidecar tests (python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The ends of the range crates/openflow-core/src/runner.rs searches for:
        # MINIMUM_PYTHON is (3, 10), and 3.14 is the newest it will pick up.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The sidecar is plain stdlib, so this needs no install step. It is the
      # only test suite in the repository that the other jobs never reach.
      # `unittest discover` prints OK and exits 0 when it finds nothing, so a
      # wrong working directory would be a permanently green job that tests
      # nothing. The guard turns that into a failure.
      - name: Test the local runner sidecar
        working-directory: crates/openflow-native/runner
        run: |
          test -f test_runner.py
          python3 -m unittest discover --verbose

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential
          libasound2-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          libwebkit2gtk-4.1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm ci
      - name: Lint platform-specific Rust paths
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: npm run tauri:build -- --no-bundle
      # The runner has no signing keychain, so this is the ad hoc fallback being
      # exercised on purpose: the branch a contributor hits before they have run
      # scripts/local-signing-identity.sh is the one most likely to rot unnoticed.
      - name: Bundle and verify the native app
        if: runner.os == 'macOS'
        run: |
          bash scripts/bundle-native.sh
          codesign --verify --strict --verbose=2 target/OpenFlow.app
