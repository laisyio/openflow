name: iOS quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Core and download lifecycle regressions
        run: swift test --package-path apps/ios/Packages/OpenFlowMobileCore
      - name: Engine package tests
        run: swift test --package-path apps/ios/Packages/OpenFlowMoonshineEngine
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate application and test project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Compile real engine, app, keyboard and widgets
        working-directory: apps/ios
        run: >-
          xcodebuild -project OpenFlow.xcodeproj -scheme OpenFlow
          -configuration Release -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Test capture controller on Simulator
        working-directory: apps/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"].values.flatten; device = devices.find { |d| d["name"].start_with?("iPhone") && d["isAvailable"] }; abort "No available iPhone simulator" unless device; puts device["udid"]')
          xcodebuild -project OpenFlow.xcodeproj -scheme OpenFlow -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
